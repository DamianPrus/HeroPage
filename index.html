<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Page - Overlapping Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .hero-title {
            color: white;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            text-align: center;
            opacity: 0;
            transform: translateY(-50px);
            animation: fadeInDown 1s ease-out 0.2s forwards;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .gallery-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-card {
            position: absolute;
            width: 320px;
            height: 420px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                180deg,
                transparent 0%,
                transparent 60%,
                rgba(0, 0, 0, 0.3) 100%
            );
            z-index: 1;
            border-radius: 30px;
        }

        .image-card:hover {
            transform: scale(1.05) translateY(-10px) !important;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.5);
            z-index: 100 !important;
        }

        .image-card:hover img {
            transform: scale(1.1);
        }

        /* Position cards with overlap */
        .card-1 {
            left: 10%;
            z-index: 1;
            opacity: 0;
            transform: translateX(-200px) rotate(-15deg) scale(0.8);
            animation: slideInLeft 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
        }

        .card-2 {
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            z-index: 3;
            opacity: 0;
            animation: slideInCenter 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s forwards;
        }

        .card-3 {
            right: 10%;
            z-index: 2;
            opacity: 0;
            transform: translateX(200px) rotate(15deg) scale(0.8);
            animation: slideInRight 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 1.1s forwards;
        }

        /* Keyframe animations */
        @keyframes fadeInDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            to {
                opacity: 1;
                transform: translateX(0) rotate(-8deg) scale(1);
            }
        }

        @keyframes slideInCenter {
            to {
                opacity: 1;
                transform: translateX(-50%) scale(1.1);
            }
        }

        @keyframes slideInRight {
            to {
                opacity: 1;
                transform: translateX(0) rotate(8deg) scale(1);
            }
        }

        /* Floating animation after entrance */
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .card-1.animate-float {
            animation: float 6s ease-in-out infinite, rotateLeft 8s ease-in-out infinite;
        }

        .card-3.animate-float {
            animation: float 6s ease-in-out infinite 2s, rotateRight 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes rotateLeft {
            0%, 100% {
                transform: rotate(-8deg) translateY(0);
            }
            50% {
                transform: rotate(-6deg) translateY(-20px);
            }
        }

        @keyframes rotateRight {
            0%, 100% {
                transform: rotate(8deg) translateY(0);
            }
            50% {
                transform: rotate(10deg) translateY(-20px);
            }
        }

        .card-2.animate-float {
            animation: floatCenter 6s ease-in-out infinite 1s;
        }

        @keyframes floatCenter {
            0%, 100% {
                transform: translateX(-50%) scale(1.1) translateY(0);
            }
            50% {
                transform: translateX(-50%) scale(1.1) translateY(-20px);
            }
        }

        /* Responsive design */
        @media (max-width: 1024px) {
            .gallery-container {
                height: 450px;
            }
            .image-card {
                width: 280px;
                height: 370px;
            }
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            .gallery-container {
                height: 400px;
            }
            .image-card {
                width: 220px;
                height: 300px;
                border-radius: 20px;
            }
            .card-1 {
                left: 5%;
            }
            .card-3 {
                right: 5%;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 2rem;
            }
            .gallery-container {
                height: 350px;
            }
            .image-card {
                width: 180px;
                height: 250px;
            }
        }

        /* Glow effect on cards */
        .image-card::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            border-radius: 32px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .image-card:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1 class="hero-title">Overlapping Image Gallery</h1>

        <div class="gallery-container">
            <div class="image-card card-1">
                <img src="Gemini_Generated_Image_1wr3p71wr3p71wr3.png" alt="Gallery Image 1">
            </div>
            <div class="image-card card-2">
                <img src="Gemini_Generated_Image_h3322xh3322xh332.png" alt="Gallery Image 2">
            </div>
            <div class="image-card card-3">
                <img src="Gemini_Generated_Image_mux542mux542mux5.png" alt="Gallery Image 3">
            </div>
        </div>
    </section>

    <script>
        // Add floating animation after entrance animations complete
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.image-card');

            // Wait for entrance animations to complete, then add floating effect
            setTimeout(() => {
                cards.forEach(card => {
                    card.classList.add('animate-float');
                });
            }, 2500);

            // Add parallax effect on mouse move
            const container = document.querySelector('.gallery-container');

            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;

                cards.forEach((card, index) => {
                    const depth = (index + 1) * 0.5;
                    card.style.transform = `${getComputedStyle(card).transform} translate(${xAxis * depth}px, ${yAxis * depth}px)`;
                });
            });
        });
    </script>
</body>
</html>
