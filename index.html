<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Page - Collage Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .hero-title {
            color: white;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1.2s ease-out 0.3s forwards;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .gallery-container {
            position: relative;
            width: 600px;
            height: 450px;
        }

        .image-card {
            position: absolute;
            width: 280px;
            height: 350px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            opacity: 0;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-card:hover {
            transform: scale(1.03) translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        /* Collage layout - images closely overlapping */
        .card-1 {
            top: 0;
            left: 0;
            z-index: 1;
            transform: rotate(-6deg);
            animation: fadeIn 1s ease-out 0.5s forwards;
        }

        .card-2 {
            top: 40px;
            left: 160px;
            z-index: 3;
            transform: rotate(2deg);
            animation: fadeIn 1s ease-out 0.8s forwards;
        }

        .card-3 {
            top: 80px;
            left: 320px;
            z-index: 2;
            transform: rotate(-3deg);
            animation: fadeIn 1s ease-out 1.1s forwards;
        }

        .card-1:hover {
            transform: rotate(-6deg) scale(1.03) translateY(-5px);
        }

        .card-2:hover {
            transform: rotate(2deg) scale(1.03) translateY(-5px);
        }

        .card-3:hover {
            transform: rotate(-3deg) scale(1.03) translateY(-5px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            .gallery-container {
                width: 400px;
                height: 380px;
            }
            .image-card {
                width: 200px;
                height: 260px;
                border-radius: 18px;
            }
            .card-2 {
                top: 30px;
                left: 100px;
            }
            .card-3 {
                top: 60px;
                left: 200px;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 2rem;
            }
            .gallery-container {
                width: 300px;
                height: 320px;
            }
            .image-card {
                width: 160px;
                height: 210px;
                border-radius: 14px;
            }
            .card-2 {
                top: 25px;
                left: 70px;
            }
            .card-3 {
                top: 50px;
                left: 140px;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1 class="hero-title">Overlapping Image Gallery</h1>

        <div class="gallery-container">
            <div class="image-card card-1">
                <img src="Gemini_Generated_Image_1wr3p71wr3p71wr3.png" alt="Gallery Image 1">
            </div>
            <div class="image-card card-2">
                <img src="Gemini_Generated_Image_h3322xh3322xh332.png" alt="Gallery Image 2">
            </div>
            <div class="image-card card-3">
                <img src="Gemini_Generated_Image_mux542mux542mux5.png" alt="Gallery Image 3">
            </div>
        </div>
    </section>
</body>
</html>
